name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: seniorlifeos
  REGISTRY: ghcr.io
  GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
  REGISTRY_USER: ${{ github.actor }}
  REPO_OWNER: ${{ github.repository_owner }}

jobs:
  # ============================================================================
  # Stage 1: Build & Verify Docker Image
  # ============================================================================
  build:
    name: "1. Build Image"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Docker Image
        run: python ci/build.py

  # ============================================================================
  # Stage 2: Calculate & Increment Version Tag
  # ============================================================================
  tag:
    name: "2. Calculate Tag"
    needs: build
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.calc_tag.outputs.new_tag }}
    steps:
      - name: Checkout Code with Full Tag History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Git Bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@bot.seniorlifeos.com"

      - name: Calculate & Increment Version Tag
        id: calc_tag
        run: python ci/tag.py

  # ============================================================================
  # Stage 3: Publish Docker Image to GitHub Packages (ghcr.io)
  # ============================================================================
  publish:
    name: "3. Publish to GHCR"
    needs: [build, tag]
    runs-on: ubuntu-latest
    env:
      NEW_TAG: ${{ needs.tag.outputs.new_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build & Publish Image to GHCR
        run: |
          python ci/build.py
          python ci/publish.py

  # ============================================================================
  # Stage 4: Push Git Tag & Create GitHub Release
  # ============================================================================
  release:
    name: "4. Create GitHub Release"
    needs: [tag, publish]
    runs-on: ubuntu-latest
    env:
      NEW_TAG: ${{ needs.tag.outputs.new_tag }}
    steps:
      - name: Checkout Code with Full Tag History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Git Bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push Git Tag & Create GitHub Release
        run: python ci/tag.py --push

  # ============================================================================
  # Stage 5: Deploy (Placeholder)
  # ============================================================================
  deploy:
    name: "5. Deploy Placeholder"
    needs: [publish, release]
    runs-on: ubuntu-latest
    env:
      NEW_TAG: ${{ needs.tag.outputs.new_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Deploy Step
        run: python ci/deploy.py
