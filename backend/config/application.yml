app:
  name: ${APP_NAME:SeniorLife OS}
  version: ${APP_VERSION:auto}
  environment: ${APP_ENV:development}
  debug: ${DEBUG:true}
  demo_mode: ${DEMO_MODE:true}

server:
  host: ${SERVER_HOST:0.0.0.0}
  port: ${SERVER_PORT:8000}

# PostgreSQL for the document vault (backend/storage). Set DATABASE_URL in .env:
#   postgresql+asyncpg://USER:PASSWORD@localhost:5432/seniorlife_os
# Any postgresql:// URL works; the vault connects with psycopg. No default here, so a
# missing URL is reported (503) instead of trying a built-in user and password.
# Tests use TEST_DATABASE_URL (a database whose name ends in _test); files are encrypted
# with SENIORLIFE_STORAGE_KEY into SENIORLIFE_STORAGE_DIR. See backend/README.md.
database:
  url: ${DATABASE_URL:}
  echo: ${DATABASE_ECHO:false}  # log SQL statements (values are always hidden)
  pool_size: ${DATABASE_POOL_SIZE:5}
  max_overflow: ${DATABASE_MAX_OVERFLOW:10}

security:
  hash_key: ${SENIORLIFE_HASH_KEY:}
  token_secret: ${JWT_SECRET:change-me-in-production-secret-key-32-chars-min}

llm:
  provider: ${SENIORLIFE_LLM_PROVIDER:groq}
  groq:
    model: ${SENIORLIFE_LLM_MODEL:openai/gpt-oss-20b}
    api_key: ${GROQ_API_KEY:}
    temperature: ${GROQ_TEMPERATURE:0.0}
  openai:
    model: ${SENIORLIFE_LLM_MODEL:gpt-4o}
    api_key: ${OPENAI_API_KEY:}
    temperature: ${OPENAI_TEMPERATURE:0.0}

actuator:
  enabled: ${ACTUATOR_ENABLED:true}

