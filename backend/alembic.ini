# Database migrations for the document vault (backend/storage/models.py).
# From the repository root:
#   backend/.venv/Scripts/alembic -c backend/alembic.ini upgrade head
# The database comes from DATABASE_URL (environment or .env), or: -x url=postgresql://...
# LangGraph's checkpoint tables are not managed here; the checkpointer creates them.

[alembic]
script_location = %(here)s/storage/migrations
prepend_sys_path = %(here)s/..
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
