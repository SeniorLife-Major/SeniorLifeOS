# The cluster-wide pieces in k8s-platform/ (Let's Encrypt issuer, ArgoCD's own https ingress).
# They need cert-manager's CRDs, so the first syncs may fail until cert-manager is up: it retries.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SeniorLife-Major/SeniorLifeOS.git
    targetRevision: main
    path: k8s-platform
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
