apiVersion: v1
kind: Secret
metadata:
  name: repo-seniorlifeos
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/SeniorLife-Major/SeniorLifeOS.git
  # Replace with your actual GitHub Personal Access Token (classic 'repo' scope or fine-grained Contents:Read)
  password: "REPLACE_WITH_YOUR_GITHUB_PERSONAL_ACCESS_TOKEN"
  username: "github-actions"
