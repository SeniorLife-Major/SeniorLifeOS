apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seniorlife-ingress
  namespace: seniorlifeos
  labels:
    app.kubernetes.io/name: seniorlifeos
    app.kubernetes.io/component: ingress
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seniorlife-backend
                port:
                  number: 8000
