apiVersion: v1
kind: Service
metadata:
  name: seniorlife-postgres
  namespace: seniorlifeos
  labels:
    app.kubernetes.io/name: seniorlifeos
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app: seniorlife-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
