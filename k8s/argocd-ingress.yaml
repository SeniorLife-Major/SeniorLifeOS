# https://argocd.seniorlifeos.rohanbatra.dpdns.org through Traefik with a real certificate.
# argocd-server keeps its own self-signed https, so Traefik talks https to it without verifying
# (ServersTransport, set on the Service below: Traefik reads those two settings from the Service,
# not the Ingress) and the NodePort https://<ip>:30080 keeps working.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: argocd-insecure
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-server-traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: argocd-argocd-insecure@kubernetescrd
spec:
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: https
      port: 443
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: argocd-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - argocd.seniorlifeos.rohanbatra.dpdns.org
      secretName: argocd-tls
  rules:
    - host: argocd.seniorlifeos.rohanbatra.dpdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server-traefik
                port:
                  number: 443
