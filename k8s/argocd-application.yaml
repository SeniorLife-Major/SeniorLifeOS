apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seniorlifeos
  namespace: argocd
  labels:
    app.kubernetes.io/name: seniorlifeos
    app.kubernetes.io/part-of: seniorlife-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/SeniorLife-Major/SeniorLifeOS.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: seniorlifeos
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
