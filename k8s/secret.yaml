# TEMPLATE ONLY: not in kustomization.yaml, so ArgoCD never applies it. Real secrets are never
# committed. Create the secret by hand in the cluster, from a file kept off git (see README.md):
#
#   kubectl -n seniorlifeos create secret generic seniorlife-env --from-env-file=seniorlife.env
#
# where seniorlife.env holds the keys below as KEY=value lines, every value filled in.
# Make random values with: openssl rand -hex 32 (64 hex characters) / openssl rand -base64 48
apiVersion: v1
kind: Secret
metadata:
  name: seniorlife-env
  namespace: seniorlifeos
  labels:
    app.kubernetes.io/name: seniorlifeos
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database (used by the postgres pod and the backend). The password: letters and digits only,
  # and the same one inside DATABASE_URL.
  POSTGRES_DB: "seniorlife_os"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: ""
  DATABASE_URL: "postgresql+asyncpg://postgres:<POSTGRES_PASSWORD>@seniorlife-postgres:5432/seniorlife_os"

  # Signs sign-ins: 32 characters or more, random. Production refuses a placeholder.
  JWT_SECRET: ""
  # Hashes ID numbers to find duplicates: 32 characters or more, random.
  SENIORLIFE_HASH_KEY: ""
  # Encrypt stored documents and paused workflows: exactly 64 hex characters each. Keep a copy
  # somewhere safe: what was stored with a key can't be opened with any other.
  SENIORLIFE_STORAGE_KEY: ""
  SENIORLIFE_CHECKPOINT_KEY: ""

  # Doctor search always reads the request with the AI model (Groq); Geoapify finds typed places;
  # Apify asks Practo for the doctors, live, on every search.
  GROQ_API_KEY: ""
  GEOAPIFY_API_KEY: ""
  APIFY_API: ""

  # Optional: leave out or empty if not used.
  OPENAI_API_KEY: ""
  GOOGLE_VISION_API_KEY: ""
  LANGSMITH_API_KEY: ""
