apiVersion: v1
kind: Secret
metadata:
  name: seniorlife-secrets
  namespace: seniorlifeos
  labels:
    app.kubernetes.io/name: seniorlifeos
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database Credentials (used by both postgres pod and backend application)
  POSTGRES_DB: "seniorlife_os"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres_production_password"
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres_production_password@seniorlife-postgres:5432/seniorlife_os"

  # Cryptography & Security Keys (AES-256-GCM 64-hex char keys, 32 bytes)
  JWT_SECRET: "change-me-to-a-secure-random-32-character-secret-in-production"
  SENIORLIFE_HASH_KEY: "change-me-to-a-secure-salt-key-minimum-32-chars-long"
  SENIORLIFE_STORAGE_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
  SENIORLIFE_CHECKPOINT_KEY: "ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100"

  # AI & OCR API Keys (populate with valid keys in cluster / secret manager)
  GROQ_API_KEY: ""
  OPENAI_API_KEY: ""
  GOOGLE_VISION_API_KEY: ""
  LANGSMITH_API_KEY: ""
