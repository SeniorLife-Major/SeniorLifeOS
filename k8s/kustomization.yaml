apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: seniorlifeos

resources:
  - namespace.yaml
  - configmap.yaml
  # secret.yaml is a template only: the real secret, seniorlife-env, is created by hand with
  # kubectl and never committed (README.md).
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - backend-pvc.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - ingress.yaml
  - hpa.yaml

images:
  - name: ghcr.io/seniorlife-major/seniorlifeos
    newTag: v1.1.8
