apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No global namespace: every manifest names its own, since some live in argocd and cert-manager.

resources:
  - namespace.yaml
  - configmap.yaml
  # secret.yaml is a template only: the real secret, seniorlife-env, is created by hand with
  # kubectl and never committed (README.md).
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - backend-pvc.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - middleware-redirect-https.yaml
  - cert-manager-app.yaml
  - cluster-issuer.yaml
  - argocd-ingress.yaml
  - ingress.yaml
  - hpa.yaml

images:
  - name: ghcr.io/seniorlife-major/seniorlifeos
    newTag: v1.2.1
