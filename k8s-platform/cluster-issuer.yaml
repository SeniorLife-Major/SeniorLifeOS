# Applied by ArgoCD's "platform" app (argocd-apps/platform.yaml); cert-manager itself comes from
# argocd-apps/cert-manager.yaml. Let's Encrypt, proven over plain http on port 80 (HTTP-01) through Traefik.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
